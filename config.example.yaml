# sysenv ai chat / ai task 配置文件示例（脱敏模板）
# 真实使用时请复制为 ~/.sysenv/config.yaml 并填入你自己的 api_key。
# 默认路径：~/.sysenv/config.yaml；也可用 `sysenv ai chat -c FILE` / `sysenv ai task -c FILE` 覆盖。

# 顶层 model：选择聊天模型（可省略；`ai chat -m/--model` 可临时覆盖它）
#   - 缺失           -> 第一个 provider 的第 1 个 model
#   - provider:model -> 指定 provider 下名称匹配的 model
#   - provider:*     -> 该 provider 下所有 model，按 weight 加权轮询
#   - model（裸名）  -> 所有 provider 中名称匹配的 model，按 weight 加权轮询
#   - 以上可用半角逗号 , 或全角逗号 ，分隔多个选择，按权重轮询使用（如 "agnes:*,claude:claude-3-5-sonnet"）
model: agnes-3.0-flash

# clients：provider（供应商）配置列表
# 约定：同一 provider 的模型必须配置在同一个 provider 块下，不要把同一 provider 拆成多个条目
clients:
  # type: openai（默认，兼容 "open"）| anthropic
  # 必填：name / api_base / api_key / models
  - type: openai
    name: agnes
    api_base: https://apihub.example-ai.cn/v1
    api_key: sk-REPLACE-WITH-YOUR-KEY
    models:
      - name: agnes-3.0-flash
        weight: 1          # 轮询权重，取值范围 0-9，缺省 1；请求失败自动 -1（最低 1），替补成功自动 +1（最高 9），并写回本配置
        # max_input_tokens / type 可选手动填写；缺失时 chat 不查询任何外部数据、不写回配置，
        # 仅在显式传 `sys ai chat --update` 时从 models.dev（24h 缓存）补齐缺失字段并写回本配置
        # max_input_tokens: 524288
        # type: text,image
  # Anthropic 示例（Claude API 标准：/v1/messages，x-api-key）
  - type: anthropic
    name: claude
    api_base: https://api.anthropic.com
    api_key: sk-ant-REPLACE-WITH-YOUR-KEY
    models:
      - name: claude-3-5-sonnet

# 顶层 web：`--web` 默认使用哪个搜索（命令行 `--web[=PROVIDER]` 优先级更高）
#   - auto（默认）：用 webs 段第一个条目（配置顺序即优先级）
#   - bocha / deepseek / yuanbao：锁定对应引擎（name 含该词的第一个条目）
#   - 其他值：按条目名匹配
# web: auto

# webs：联网搜索 API key（`sys ai chat --web[=PROVIDER]` 联网搜索使用）
# - `--web=bocha`：强制博查（name 含 bocha 的条目；key 在博查开放平台 open.bochaai.com 申请）
# - `--web=deepseek`：强制 DeepSeek 官方 Search API（name 含 deepseek 的条目；key 即 DeepSeek 开放平台 API Key，
#   `POST https://api.deepseek.com/v1/tools/search`，按成功请求计费，文档 https://api-docs.deepseek.com/guides/search/）
# - `--web=yuanbao`：强制腾讯元宝搜索（name 含 yuanbao 的条目）。支持两种鉴权：
#   1) 服务 API KEY（Bearer 单 key，元宝搜索控制台创建）；
#   2) 腾讯云标准方式：`SecretId`（AKID 开头）+ `SecretKey`（CAM 密钥，TC3-HMAC-SHA256 签名，推荐）
webs:
  - name: bochaai
    key: sk-REPLACE-WITH-YOUR-KEY
  - name: deepseek
    key: sk-REPLACE-WITH-DEEPSEEK-API-KEY
  - name: yuanbao
    SecretId: AKIDREPLACE-WITH-YOUR-SECRET-ID
    SecretKey: REPLACE-WITH-YOUR-SECRET-KEY

# tasks：ai task 任务模板（name 必填，desc 描述，msg 聊天消息）
# `ai task -t * "用户需求"`：对全部任务打分（0-10 分匹配度，0 不匹配 / 10 完全匹配），输出 TASK / DESC / SCORE 并按分数排序
tasks:
  - name: weather
    desc: 用来获取天气信息
    # {key:默认值} 占位符：命令行传 country:北京 则替换，否则用默认值 深圳
    # msg 以 file:// 开头读取本地相对路径文件；以 url: 开头抓取网络内容
    msg: 我在{country:深圳},今天的天气如何，我要询问温度、湿度、下雨概率等信息

# 顶层 stream：true 时 ai chat / ai task 默认 SSE 流式输出（--no-stream 关闭；--debug 时自动非流式）
stream: true
